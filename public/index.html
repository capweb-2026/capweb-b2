<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#059669">
    <title>Cap Web — départ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <span class="blob blob--1"></span>
      <span class="blob blob--2"></span>
      <span class="blob blob--3"></span>
    </div>
    <header>
      <span class="logo" aria-hidden="true">🚲</span>
      <div class="brand">
        <h1>Vélix</h1>
        <p class="brand__tag">Votre conseiller réparation &amp; entretien vélo</p>
      </div>
    </header>
    <main>
      <section class="card" aria-labelledby="titre-chat">
        <div class="card__head">
          <h2 id="titre-chat">Discussion</h2>
          <span class="live-badge"><span class="live-badge__dot"></span>En ligne</span>
        </div>
        <p id="accueil" class="welcome"></p>
        <div id="suggestions" class="suggestions" aria-label="Questions suggérées"></div>
        <ul id="messages" aria-label="Messages" aria-live="polite"></ul>
        <form id="chat-form">
          <label for="message">Votre message</label>
          <div class="field">
            <textarea id="message" name="message" rows="3" required maxlength="280" placeholder="Posez votre question à Vélix…"></textarea>
            <span id="compteur">0/280</span>
          </div>
          <div class="actions">
            <button type="Submit" class="btn btn--primary">Envoyer</button>
            <button type="button" id="effacer" class="btn btn--ghost">Effacer la conversation</button>
          </div>
        </form>
        <p class="note">Le serveur fonctionne. Aujourd’hui, nous construisons notre interface.</p>
        <p id="status" role="status"></p>
      </section>
    </main>
    <footer>
      <span id="version">Version 1.0.0</span>
    </footer>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
